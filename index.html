      border: 2px solid #e7e5e4;

      box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.05);

      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-card {
      animation: fadeSlideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }

    /*************************************************************************
     * 2. РАСПАКОВКА БАЗЫ В 50 КАТЕГОРИЙ × 50 СЛОВ С ДЕТЕРМИНИРОВАННЫМ ПОРЯДКОМ
     *************************************************************************/
    function buildDecks() {
      return RAW_DECKS.map((raw, catIndex) => {
        const [title, icon, derStr, dieStr, dasStr] = raw;
        const parseGroup = (str, article) => {
          if (!str) return [];
          return str.split('|').map(item => {
            const [de, ru, emoji] = item.split(',');
            return { de: de.trim(), ru: ru.trim(), emoji: (emoji || icon).trim(), article };
          });
        };

        const words = [
          ...parseGroup(derStr, 'der'),
          ...parseGroup(dieStr, 'die'),
          ...parseGroup(dasStr, 'das')
        ];

        // Детерминированное перемешивание, чтобы рода der/die/das шли вперемешку
        const mixed = [...words];
        let seed = (catIndex + 1) * 1337;
        for (let i = mixed.length - 1; i > 0; i--) {
          seed = (seed * 16807) % 2147483647;
          const j = seed % (i + 1);
          const temp = mixed[i];
          mixed[i] = mixed[j];
          mixed[j] = temp;
        }

        return {
          id: catIndex,
          title,
          icon,
          words: mixed.slice(0, 50)
        };
      });
    }

    const DECKS = buildDecks();

    /*************************************************************************
     * 3. НАДЁЖНОЕ ХРАНИЛИЩЕ ПРОГРЕССА (LOCALSTORAGE + INDEXEDDB + АВТОСОХРАНЕНИЕ)
     * Поддержка двух профилей: "olo" (пароль "7ololo7") и "максим" (пароль "olo666")
     *************************************************************************/
    const VALID_USERS = {
      "olo": { pass: "7ololo7", displayName: "olo" },
      "максим": { pass: "olo666", displayName: "Максим" }
    };

    const SESSION_KEY = "de_active_user_v3";
    const PROGRESS_PREFIX = "de_progress_v3_";
    const LEGACY_PREFIX = "de_app_progress_v1_";

    // Кэш данных текущего пользователя в оперативной памяти для мгновенного отклика
    let memoryProgressCache = {
      olo: {},
      "максим": {}
    };

    // Инициализация IndexedDB для дублирования данных (защита от сброса кэша на iOS / Huawei)
    const IDB_NAME = "GermanLearnerDB";
    const IDB_STORE = "user_data";
    let idbInstance = null;

    function openDatabase() {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        try {
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = (e) => {
            idbInstance = e.target.result;
            resolve(idbInstance);
          };
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
    }

    function idbGet(key) {
      return new Promise((resolve) => {
        if (!idbInstance) return resolve(null);
        try {
          const tx = idbInstance.transaction(IDB_STORE, "readonly");
          const store = tx.objectStore(IDB_STORE);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    }

    function idbSet(key, val) {
      return new Promise((resolve) => {
        if (!idbInstance) return resolve(false);
        try {
          const tx = idbInstance.transaction(IDB_STORE, "readwrite");
          const store = tx.objectStore(IDB_STORE);
          store.put(val, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    }

    // Нормализация и слияние прогресса из разных источников (чтобы никогда не терять выученные слова)
    function normalizeDeckRecord(rec) {
      if (!rec || typeof rec !== "object") {
        return {
          learnedIds: [],
          correct: 0,
          percent: 0,
          studyIndex: 0,
          testIndex: 0,
          updatedAt: 0
        };
      }
      const learnedSet = new Set(Array.isArray(rec.learnedIds) ? rec.learnedIds : []);
      // Если есть старый формат { correct, percent } без learnedIds, сконвертируем его
      let legacyCorrect = typeof rec.correct === "number" ? rec.correct : 0;
      if (legacyCorrect === 0 && typeof rec.percent === "number" && rec.percent > 0) {
        legacyCorrect = Math.round((rec.percent / 100) * 50);
      }
      if (learnedSet.size < legacyCorrect) {
        for (let i = 0; i < legacyCorrect && i < 50; i++) {
          learnedSet.add(i);
        }
      }
      const learnedIds = Array.from(learnedSet).filter(n => Number.isInteger(n) && n >= 0 && n < 50);
      const correct = learnedIds.length;
      const percent = Math.min(100, Math.round((correct / 50) * 100));
      return {
        learnedIds,
        correct,
        percent,
        studyIndex: Number.isInteger(rec.studyIndex) && rec.studyIndex >= 0 && rec.studyIndex < 50 ? rec.studyIndex : 0,
        testIndex: Number.isInteger(rec.testIndex) && rec.testIndex >= 0 && rec.testIndex < 50 ? rec.testIndex : 0,
        updatedAt: rec.updatedAt || Date.now()
      };
    }

    function mergeUserProgressMaps(mapA = {}, mapB = {}) {
      const result = {};
      const allDeckIds = new Set([...Object.keys(mapA), ...Object.keys(mapB)]);
      allDeckIds.forEach(deckId => {
        const a = normalizeDeckRecord(mapA[deckId]);
        const b = normalizeDeckRecord(mapB[deckId]);
        const mergedSet = new Set([...a.learnedIds, ...b.learnedIds]);
        const learnedIds = Array.from(mergedSet);
        const correct = learnedIds.length;
        const percent = Math.min(100, Math.round((correct / 50) * 100));
        const newer = (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a;
        result[deckId] = {
          learnedIds,
          correct,
          percent,
          studyIndex: newer.studyIndex || 0,
          testIndex: newer.testIndex || 0,
          updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0, Date.now())
        };
      });
      return result;
    }

    // Загрузка прогресса пользователя из localStorage (включая миграцию со старого ключа v1)
    function loadProgressFromLocalStorage(username) {
      if (!username) return {};
      let current = {};
      let legacy = {};
      try {
        const rawCur = localStorage.getItem(PROGRESS_PREFIX + username);
        if (rawCur) current = JSON.parse(rawCur);
      } catch (e) {}
      try {
        const rawLeg = localStorage.getItem(LEGACY_PREFIX + username);
        if (rawLeg) legacy = JSON.parse(rawLeg);
      } catch (e) {}
      return mergeUserProgressMaps(legacy, current);
    }

    // Инициализация всех пользователей при старте
    Object.keys(VALID_USERS).forEach(u => {
      memoryProgressCache[u] = loadProgressFromLocalStorage(u);
    });

    function normalizeUserKey(raw) {
      if (!raw || typeof raw !== "string") return null;
      const clean = raw.trim().toLowerCase();
      return VALID_USERS[clean] ? clean : null;
    }

    const initialSavedUser = normalizeUserKey(
      localStorage.getItem(SESSION_KEY) || localStorage.getItem("de_app_active_user_v1")
    );

    const state = {
      user: initialSavedUser,
      screen: initialSavedUser ? "categories" : "login", // "login" | "categories" | "mode_select" | "session" | "summary"
      searchQuery: "",
      selectedDeckId: 0,
      mode: "study", // "study" | "test" | "learned_quiz"
      quizPool: [], // Список всех выученных слов для режима "Проверка изученных слов"
      cardIndex: 0,
      sessionCorrect: 0,
      sessionAnswered: 0,
      mistakes: [],
      feedback: null, // { isCorrect, userAnswer, correctFull }
      testInput: "",
      loginError: "",
      showSyncModal: false,
      syncStatusMsg: ""
    };

    function getUserProgress(username = state.user) {
      if (!username) return {};
      if (!memoryProgressCache[username]) {
        memoryProgressCache[username] = loadProgressFromLocalStorage(username);
      }
      return memoryProgressCache[username];
    }

    function persistUserProgressNow(username = state.user) {
      if (!username || !VALID_USERS[username]) return;
      const data = getUserProgress(username);
      const serialized = JSON.stringify(data);
      try {
        localStorage.setItem(PROGRESS_PREFIX + username, serialized);
      } catch (e) {}
      // Дублируем в IndexedDB
      idbSet(PROGRESS_PREFIX + username, data);
    }

    function getDeckState(deckId, username = state.user) {
      const all = getUserProgress(username);
      if (!all[deckId]) {
        all[deckId] = normalizeDeckRecord(null);
      } else {
        all[deckId] = normalizeDeckRecord(all[deckId]);
      }
      return all[deckId];
    }

    // Мгновенное сохранение ответа по конкретной карточке (не теряется при закрытии вкладки!)
    function recordCardProgress(deckId, wordIdx, isCorrect, nextCardIdx, mode) {
      if (!state.user) return;
      const deckRec = getDeckState(deckId);
      const learnedSet = new Set(deckRec.learnedIds);

      if (isCorrect) {
        learnedSet.add(wordIdx);
      }

      deckRec.learnedIds = Array.from(learnedSet);
      deckRec.correct = deckRec.learnedIds.length;
      deckRec.percent = Math.min(100, Math.round((deckRec.correct / 50) * 100));

      if (typeof nextCardIdx === "number" && (mode === "study" || mode === "test")) {
        const safeNextIdx = nextCardIdx >= 50 ? 0 : nextCardIdx;
        if (mode === "study") {
          deckRec.studyIndex = safeNextIdx;
        } else if (mode === "test") {
          deckRec.testIndex = safeNextIdx;
        }
      }
      deckRec.updatedAt = Date.now();

      memoryProgressCache[state.user][deckId] = deckRec;
      persistUserProgressNow(state.user);
    }

    function resetSingleDeckProgress(deckId) {
      if (!state.user) return;
      memoryProgressCache[state.user][deckId] = normalizeDeckRecord(null);
      persistUserProgressNow(state.user);
    }

    // Сбор всех изученных слов пользователя по всем 50 категориям
    function collectAllLearnedWords(username = state.user) {
      if (!username) return [];
      const progressMap = getUserProgress(username);
      const list = [];
      for (let deckId = 0; deckId < DECKS.length; deckId++) {
        const deck = DECKS[deckId];
        const rec = normalizeDeckRecord(progressMap[deckId]);
        if (rec.learnedIds && rec.learnedIds.length > 0) {
          rec.learnedIds.forEach(wordIdx => {
            const wordObj = deck.words[wordIdx];
            if (wordObj) {
              list.push({
                deckId,
                wordIdx,
                wordObj,
                deckTitle: deck.title
              });
            }
          });
        }
      }
      return list;
    }

    // Асинхронная синхронизация с IndexedDB при загрузке страницы
    openDatabase().then(async () => {
      for (const u of Object.keys(VALID_USERS)) {
        const idbData = await idbGet(PROGRESS_PREFIX + u);
        if (idbData) {
          memoryProgressCache[u] = mergeUserProgressMaps(memoryProgressCache[u], idbData);
          try {
            localStorage.setItem(PROGRESS_PREFIX + u, JSON.stringify(memoryProgressCache[u]));
          } catch (e) {}
        } else {
          await idbSet(PROGRESS_PREFIX + u, memoryProgressCache[u]);
        }
      }
      const idbUser = await idbGet(SESSION_KEY);
      if (!state.user && idbUser && VALID_USERS[idbUser]) {
        state.user = idbUser;
        localStorage.setItem(SESSION_KEY, idbUser);
        state.screen = "categories";
      }
      render();
    });

    // Сохранение при сворачивании вкладки или закрытии Safari / Huawei Browser
    window.addEventListener("pagehide", () => {
      if (state.user) persistUserProgressNow(state.user);
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && state.user) {
        persistUserProgressNow(state.user);
      }
    });

    /*************************************************************************
     * 4. ГЕНЕРАТОР МГНОВЕННЫХ ВЕКТОРНЫХ SVG-КАРТОЧЕК (0 МС ЗАГРУЗКИ)
     *************************************************************************/
    function renderSvgIllustration(wordObj, mode, article) {

        if (article === "das") palette = { bg1: "#ecfdf5", bg2: "#d1fae5", accent: "#10b981" };

    /*************************************************************************
     * 5. НАДЁЖНАЯ НЕМЕЦКАЯ ОЗВУЧКА СТРОГО С АРТИКЛЕМ (iPhone 14 + Huawei Pura 70)
     * 1) Всегда произносит "${article} ${de}" (например, "der Tisch", "die Lampe").
     * 2) Запускается СТРОГО синхронно по нажатию на кнопку микрофона через
     *    <audio id="ttsAudio" referrerpolicy="no-referrer"> с потоком Google German TTS,
     *    благодаря чему iPhone 14 (iOS Safari) и Huawei Pura 70 произносят слова
     *    эталонным немецким голосом, а не читают латиницу русским голосом.
     * 3) Если телефон полностью офлайн, используется fallback на Web Speech API
     *    ТОЛЬКО при наличии подлинного немецкого голоса (Anna, Helena, Petra, Martin и т.д.).
     *************************************************************************/
    let cachedGermanVoice = null;

    function findGenuineGermanVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;

      const noveltyRegex = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|pipe organ|trinoids|whisper|zarvox|jester|superstar|wobble/i;
      const deVoices = voices.filter(v => {
        if (!v || !v.lang) return false;
        const normLang = v.lang.replace('_', '-').toLowerCase();
        return normLang.startsWith('de') && !noveltyRegex.test(v.name || '');
      });

      if (!deVoices.length) return null;

      const preferredNames = ['anna', 'helena', 'petra', 'viktor', 'martin', 'markus', 'google deutsch', 'siri', 'marlene'];
      for (const pref of preferredNames) {
        const match = deVoices.find(v => (v.name || '').toLowerCase().includes(pref));
        if (match) return match;
      }

      return deVoices.find(v => v.lang.replace('_', '-').toLowerCase() === 'de-de') || deVoices[0];
    }

    if ("speechSynthesis" in window) {
      cachedGermanVoice = findGenuineGermanVoice();
      if (typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
        window.speechSynthesis.onvoiceschanged = () => {
          cachedGermanVoice = findGenuineGermanVoice();
        };
      }
    }

    function speakOfflineGermanFallback(phrase) {
      if (!("speechSynthesis" in window)) return;
      const genuineVoice = cachedGermanVoice || findGenuineGermanVoice();
      // Никогда не запускаем синтез без явно найденного немецкого голоса,
      // чтобы iOS не читала немецкие буквы русским голосом
      if (!genuineVoice) return;

      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(phrase);
        utter.voice = genuineVoice;
        utter.lang = "de-DE";
        utter.rate = 0.9;
        utter.pitch = 1.0;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function speakGermanWordWithArticle(wordObj, buttonEl = null) {
      if (!wordObj || !wordObj.article || !wordObj.de) return;
      const phrase = `${wordObj.article} ${wordObj.de}`.trim();

      const targetBtn = buttonEl || document.getElementById("MainSpeakButton");
      if (targetBtn) {
        targetBtn.classList.remove("speaking-pulse");
        void targetBtn.offsetWidth;
        targetBtn.classList.add("speaking-pulse");
      }

      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }

      const audioEl = document.getElementById("ttsAudio");
      if (!audioEl) {
        speakOfflineGermanFallback(phrase);
        return;
      }

      const encoded = encodeURIComponent(phrase);
      const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q=${encoded}`;
      const backupTtsUrl = `https://dict.youdao.com/dictvoice?audio=${encoded}&le=de`;

      try {
        audioEl.pause();
        audioEl.onerror = () => {
          audioEl.onerror = () => {
            speakOfflineGermanFallback(phrase);
          };
          audioEl.src = backupTtsUrl;
          const p2 = audioEl.play();
          if (p2 !== undefined) {
            p2.catch(() => speakOfflineGermanFallback(phrase));
          }
        };

        audioEl.src = googleTtsUrl;
        const playPromise = audioEl.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            audioEl.onerror = null;
            audioEl.src = backupTtsUrl;
            const p2 = audioEl.play();
            if (p2 !== undefined) {
              p2.catch(() => speakOfflineGermanFallback(phrase));
            }
          });
        }
      } catch (err) {
        speakOfflineGermanFallback(phrase);
      }
    }

    /*************************************************************************
     * 6. ЭКСПОРТ / ИМПОРТ КОДА ПРОГРЕССА (ДЛЯ ПЕРЕНОСА МЕЖДУ БРАУЗЕРОМ И ИКОНКОЙ ДОМОЙ)
     *************************************************************************/
    function generateBackupCode() {
      if (!state.user) return "";
      const prog = getUserProgress(state.user);
      const compact = {};
      Object.keys(prog).forEach(deckId => {
        const rec = prog[deckId];
        if (rec && rec.learnedIds && rec.learnedIds.length > 0) {
          compact[deckId] = [rec.learnedIds, rec.studyIndex || 0, rec.testIndex || 0];
        }
      });
      const payload = JSON.stringify({ u: state.user, d: compact });
      return btoa(unescape(encodeURIComponent(payload)));
    }

    function restoreFromBackupCode(codeStr) {
      try {
        const jsonStr = decodeURIComponent(escape(atob(codeStr.trim())));
        const parsed = JSON.parse(jsonStr);
        if (!parsed || !parsed.d || typeof parsed.d !== "object") return false;

        const targetUser = state.user;
        const importedMap = {};
        Object.keys(parsed.d).forEach(deckId => {
          const arr = parsed.d[deckId];
          if (Array.isArray(arr)) {
            importedMap[deckId] = normalizeDeckRecord({
              learnedIds: arr[0] || [],
              studyIndex: arr[1] || 0,
              testIndex: arr[2] || 0,
              updatedAt: Date.now()
            });
          }
        });

        memoryProgressCache[targetUser] = mergeUserProgressMaps(getUserProgress(targetUser), importedMap);
        persistUserProgressNow(targetUser);
        return true;
      } catch (e) {
        return false;
      }
    }

    // Запуск проверки по всем изученным словам пользователя (в случайном порядке)
    function startAllLearnedQuiz() {
      const learnedPool = collectAllLearnedWords(state.user);
      if (!learnedPool.length) return;

      // Перемешиваем изученные слова случайным образом (Fisher-Yates)
      const shuffled = [...learnedPool];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = tmp;
      }

      state.mode = "learned_quiz";
      state.quizPool = shuffled;
      state.cardIndex = 0;
      state.sessionCorrect = 0;
      state.sessionAnswered = 0;
      state.mistakes = [];
      state.feedback = null;
      state.testInput = "";
      state.screen = "session";
      render();
    }

      appEl.innerHTML = `
        <div class="flex-1 flex flex-col justify-between h-full animate-card">
          <!-- Верхняя строка навигации и сохраняемого прогресса -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <button id="exitSessionBtn" class="soft-btn px-3 py-1.5 rounded-xl bg-white border border-stone-200/80 text-xs font-medium text-stone-600">
                ← Категории
              </button>
              <div class="text-xs font-semibold text-stone-500">
                ${headerInfoHtml}
              </div>
              <button id="finishNowBtn" class="soft-btn px-3 py-1.5 rounded-xl bg-white border border-stone-200/80 text-xs font-medium text-stone-600">
                Итог
              </button>
            </div>
            <div class="w-full h-1.5 bg-stone-200/70 rounded-full overflow-hidden">
              <div class="h-full bg-stone-700 rounded-full transition-all duration-200" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <!-- Центральная область: чистая картинка без оверлеев и кнопка микрофона рядом со словом -->
          <div class="my-auto py-1 flex flex-col items-center">
            <div class="mb-2 flex items-center gap-1.5">
              ${genderBadge}
              ${!isLearnedQuiz && isAlreadyLearned ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">✓ Выучено</span>` : ''}
            </div>

            <div class="relative w-full max-w-[265px] aspect-[240/165] rounded-3xl p-2 transition-all duration-200 ${frameClass}">
              ${renderSvgIllustration(wordObj, state.mode, wordObj.article)}
            </div>

            <!-- Слово и аккуратная круглая кнопка микрофона (строго по нажатию) -->
            <div class="text-center mt-2.5">
              ${state.mode === "study" ? `
                <div class="flex items-center justify-center gap-2">
                  <h3 class="text-2xl font-bold text-stone-800 tracking-tight">${wordObj.de}</h3>
                  <button
                    id="MainSpeakButton"
                    type="button"
                    aria-label="Озвучить артикль и слово по-немецки"
                    class="soft-btn w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200/80 text-stone-700 flex items-center justify-center text-base shadow-xs"
                    title="Озвучить с артиклем"
                  >
                    🎙️
                  </button>
                </div>
                <p class="text-sm text-stone-500 mt-0.5">${wordObj.ru}</p>
              ` : `
                <div class="flex items-center justify-center gap-2">
                  <p class="text-lg font-bold text-stone-800">${wordObj.ru}</p>
                  <button
                    id="MainSpeakButton"
                    type="button"
                    aria-label="Озвучить артикль и слово по-немецки"
                    class="soft-btn w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200/80 text-stone-700 flex items-center justify-center text-base shadow-xs"
                    title="Озвучить с артиклем"
                  >
                    🎙️
                  </button>
                </div>
                <p class="text-xs text-stone-400 mt-0.5">Впишите артикль и немецкое слово</p>
              `}
            </div>
          </div>

          <!-- Нижний блок взаимодействия -->
          <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-stone-200/80">
            ${state.mode === "study" ? renderStudyControls(wordObj) : renderTestControls(wordObj)}
          </div>
        </div>
      `;

      document.getElementById("exitSessionBtn").addEventListener("click", () => {
        persistUserProgressNow(state.user);
        state.screen = "categories";
        render();
      });

      document.getElementById("finishNowBtn").addEventListener("click", () => {
        persistUserProgressNow(state.user);
        state.screen = "summary";
        render();
      });

      // Озвучка СТРОГО по нажатию на кнопку микрофона и СТРОГО с артиклем (der/die/das + Wort)
      const speakBtn = document.getElementById("MainSpeakButton");
      if (speakBtn) {
        speakBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          speakGermanWordWithArticle(wordObj, speakBtn);
        });
      }

      if (state.mode === "study") {
        bindStudyEvents(wordObj);
      } else {
        bindTestEvents(wordObj);
      }
    }

    function renderStudyControls(wordObj) {
      if (state.feedback) {
        const isOk = state.feedback.isCorrect;
        return `
          <div class="text-center space-y-2.5">
            <div class="py-2.5 px-4 rounded-2xl text-sm font-semibold ${isOk ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
              ${isOk ? `Верно! ${wordObj.article} ${wordObj.de}` : `Ошибка · правильно: ${wordObj.article} ${wordObj.de}`}
            </div>
            <button id="nextCardBtn" class="soft-btn w-full py-3.5 rounded-2xl bg-stone-800 text-white font-semibold text-sm">
              Дальше →
            </button>
          </div>
        `;
      }

      return `
        <div>
          <div class="text-center text-xs text-stone-400 mb-2">Выберите правильный артикль:</div>
          <div class="grid grid-cols-3 gap-2.5">
            <button data-art="der" class="art-btn soft-btn py-3.5 rounded-2xl bg-blue-50 hover:bg-blue-100 border-2 border-blue-300 text-blue-700 font-bold text-base shadow-sm">
              der
            </button>
            <button data-art="die" class="art-btn soft-btn py-3.5 rounded-2xl bg-pink-50 hover:bg-pink-100 border-2 border-pink-300 text-pink-700 font-bold text-base shadow-sm">
              die
            </button>
            <button data-art="das" class="art-btn soft-btn py-3.5 rounded-2xl bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-300 text-emerald-700 font-bold text-base shadow-sm">
              das
            </button>
          </div>
        </div>
      `;
    }

    function bindStudyEvents(wordObj) {
      document.querySelectorAll(".art-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const chosen = btn.getAttribute("data-art");
          const isCorrect = chosen === wordObj.article;
          state.sessionAnswered++;
          if (isCorrect) {
            state.sessionCorrect++;
          } else {
            state.mistakes.push({
              wordObj,
              userAnswer: `${chosen} ${wordObj.de}`
            });
          }

          // Мгновенно сохраняем результат этой карточки в localStorage и IndexedDB
          recordCardProgress(
            state.selectedDeckId,
            state.cardIndex,
            isCorrect,
            state.cardIndex + 1,
            "study"
          );

          if (isCorrect) {
            advanceOrSummarize();
          } else {
            state.feedback = {
              isCorrect: false,
              userAnswer: chosen,
              correctFull: `${wordObj.article} ${wordObj.de}`
            };
            render();
          }
        });
      });

      const nextBtn = document.getElementById("nextCardBtn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          state.feedback = null;
          advanceOrSummarize();
        });
      }
    }

    function renderTestControls(wordObj) {
      if (state.feedback) {
        const isOk = state.feedback.isCorrect;
        return `
          <div class="text-center space-y-2.5">
            <div class="py-2.5 px-3 rounded-2xl text-sm font-semibold ${isOk ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
              ${isOk
                ? `Отлично! ${wordObj.article} ${wordObj.de}`
                : `Ваш ответ: «${state.feedback.userAnswer || '—'}»<br/>Верно: <b>${wordObj.article} ${wordObj.de}</b>`}
            </div>
            <button id="nextCardBtn" class="soft-btn w-full py-3.5 rounded-2xl bg-stone-800 text-white font-semibold text-sm">
              Следующее слово →
            </button>
          </div>
        `;
      }

      return `
        <form id="testAnswerForm" class="space-y-2.5" autocomplete="off">
          <!-- Быстрые кнопки умлаутов и артиклей для удобного ввода с телефона -->
          <div class="flex items-center justify-between gap-1">
            <button type="button" data-prefix="der " class="prefix-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">der</button>
            <button type="button" data-prefix="die " class="prefix-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">die</button>
            <button type="button" data-prefix="das " class="prefix-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">das</button>
            <div class="h-4 w-px bg-stone-200 mx-0.5"></div>
            <button type="button" data-char="ä" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ä</button>
            <button type="button" data-char="ö" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ö</button>
            <button type="button" data-char="ü" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ü</button>
            <button type="button" data-char="ß" class="char-btn soft-btn px-2.5 py-1.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-semibold">ß</button>
          </div>

          <div class="flex gap-2">
            <input
              id="testWordInput"
              type="text"
              value="${state.testInput.replace(/"/g, '&quot;')}"
              placeholder="Напр.: der Tisch"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              class="flex-1 px-4 py-3 rounded-2xl bg-stone-50 border border-stone-200 text-stone-800 focus:outline-none focus:border-stone-400 focus:bg-white"
            />
            <button type="submit" class="soft-btn px-5 py-3 rounded-2xl bg-stone-800 text-white font-semibold text-sm shrink-0">
              ОК
            </button>
          </div>
        </form>
      `;
    }

    function normalizeGermanAnswer(str) {
      return str
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase();
    }

    function bindTestEvents(wordObj) {
      const inputEl = document.getElementById("testWordInput");
      if (inputEl) {
        inputEl.addEventListener("input", (e) => {
          state.testInput = e.target.value;
        });
      }

      document.querySelectorAll(".prefix-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const pref = btn.getAttribute("data-prefix");
          if (!inputEl) return;
          const clean = inputEl.value.replace(/^(der|die|das)\s+/i, "");
          inputEl.value = pref + clean;
          state.testInput = inputEl.value;
          inputEl.focus();
        });
      });

      document.querySelectorAll(".char-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const ch = btn.getAttribute("data-char");
          if (!inputEl) return;
          const start = inputEl.selectionStart || inputEl.value.length;
          const end = inputEl.selectionEnd || inputEl.value.length;
          inputEl.value = inputEl.value.slice(0, start) + ch + inputEl.value.slice(end);
          state.testInput = inputEl.value;
          inputEl.focus();
          inputEl.setSelectionRange(start + 1, start + 1);
        });
      });

      const form = document.getElementById("testAnswerForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const userRaw = (inputEl ? inputEl.value : state.testInput).trim();
          if (!userRaw) return;

          const expected = normalizeGermanAnswer(`${wordObj.article} ${wordObj.de}`);
          const expectedAlt = expected.replace(/ß/g, "ss");
          const actual = normalizeGermanAnswer(userRaw);

          const isCorrect = actual === expected || actual === expectedAlt;
          state.sessionAnswered++;
          if (isCorrect) {
            state.sessionCorrect++;
          } else {
            state.mistakes.push({
              wordObj,
              userAnswer: userRaw
            });
          }

          if (state.mode === "learned_quiz") {
            const item = state.quizPool[state.cardIndex];
            if (item) {
              recordCardProgress(item.deckId, item.wordIdx, isCorrect, null, "learned_quiz");
            }
          } else {
            recordCardProgress(
              state.selectedDeckId,
              state.cardIndex,
              isCorrect,
              state.cardIndex + 1,
              "test"
            );
          }

          state.feedback = {
            isCorrect,
            userAnswer: userRaw,
            correctFull: `${wordObj.article} ${wordObj.de}`
          };
          state.testInput = "";
          render();
        });
      }

      const nextBtn = document.getElementById("nextCardBtn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          state.feedback = null;
          state.testInput = "";
          advanceOrSummarize();
        });
      }
    }

    function advanceOrSummarize() {
      const totalLen = state.mode === "learned_quiz"
        ? state.quizPool.length
        : DECKS[state.selectedDeckId].words.length;

      if (state.cardIndex + 1 < totalLen) {
        state.cardIndex++;
        render();
      } else {
        persistUserProgressNow(state.user);
        state.screen = "summary";
        render();
      }
    }

    /* ЭКРАН 5: ИТОГ ПО КОЛОДЕ ИЛИ ПО ВСЕМ ИЗУЧЕННЫМ СЛОВАМ */
    function renderSummary() {
      const isLearnedQuiz = state.mode === "learned_quiz";
      let title = "";
      let subtitle = "";
      let statLeftTop = "";
      let statLeftBottom = "";
      let statRightTop = "";
      let statRightBottom = "";
      let badgeEmoji = "🌱";

      if (isLearnedQuiz) {
        const accuracy = state.sessionAnswered > 0
          ? Math.round((state.sessionCorrect / state.sessionAnswered) * 100)
          : 0;
        badgeEmoji = accuracy >= 80 ? "🏆" : accuracy >= 50 ? "👏" : "🎯";
        title = "Проверка изученных слов";
        subtitle = `Профиль: ${VALID_USERS[state.user].displayName} · Всего в пуле: ${state.quizPool.length} сл.`;
        statLeftTop = `${state.sessionCorrect} / ${state.sessionAnswered}`;
        statLeftBottom = "Верных ответов в сессии";
        statRightTop = `${accuracy}%`;
        statRightBottom = "Точность проверки";
      } else {
        const deck = DECKS[state.selectedDeckId];
        const deckProg = getDeckState(deck.id);
        badgeEmoji = deckProg.percent >= 80 ? "🏆" : deckProg.percent >= 50 ? "👏" : "🌱";
        title = deck.title;
        subtitle = `Режим: ${state.mode === "study" ? "Изучение" : "Проверка"} · Профиль: ${VALID_USERS[state.user].displayName}`;
        statLeftTop = `${deckProg.correct} / 50`;
        statLeftBottom = "Всего изучено в колоде";
        statRightTop = `${deckProg.percent}%`;
        statRightBottom = "Сохранённый прогресс";
      }

      appEl.innerHTML = `
        <div class="flex-1 flex flex-col h-full animate-card">
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-stone-200/80 text-center mb-3">
            <div class="w-16 h-16 rounded-3xl bg-stone-50 border border-stone-100 flex items-center justify-center text-3xl mx-auto mb-2">
              ${badgeEmoji}
            </div>
            <h2 class="text-lg font-bold text-stone-800">${title}</h2>
            <p class="text-xs text-stone-400 mt-0.5">${subtitle}</p>

            <div class="grid grid-cols-2 gap-2.5 my-4">
              <div class="p-3 rounded-2xl bg-stone-50 border border-stone-100">
                <div class="text-xl font-bold text-stone-800">${statLeftTop}</div>
                <div class="text-[11px] text-stone-400">${statLeftBottom}</div>
              </div>
              <div class="p-3 rounded-2xl bg-stone-50 border border-stone-100">
                <div class="text-xl font-bold text-emerald-600">${statRightTop}</div>
                <div class="text-[11px] text-stone-400">${statRightBottom}</div>
              </div>
            </div>

            <div class="flex gap-2">
              <button id="retryDeckBtn" class="soft-btn flex-1 py-3 rounded-2xl bg-stone-100 text-stone-700 font-semibold text-xs">
                ${isLearnedQuiz ? 'Ещё раз' : 'Пройти сначала'}
              </button>
              <button id="toCategoriesBtn" class="soft-btn flex-1 py-3 rounded-2xl bg-stone-800 text-white font-semibold text-xs">
                К 50 категориям
              </button>
            </div>
          </div>

          <!-- Список ошибок (с кнопкой микрофона для озвучки каждого слова с артиклем) -->
          <div class="scroll-area space-y-2 pb-4">
            ${state.mistakes.length === 0 ? `
              <div class="bg-white rounded-2xl p-5 text-center border border-stone-200/60 text-xs text-stone-400">
                Ни одной ошибки в этой сессии!
              </div>
            ` : `
              <div class="text-xs font-semibold text-stone-500 px-1 mb-1">
                Ошибки в сессии:
              </div>
              ${state.mistakes.map((m, idx) => {
                const badgeColor = m.wordObj.article === 'der'
                  ? 'bg-blue-100 text-blue-700'
                  : m.wordObj.article === 'die'
                    ? 'bg-pink-100 text-pink-700'
                    : 'bg-emerald-100 text-emerald-700';
                return `
                  <div class="w-full bg-white rounded-2xl p-3 border border-stone-200/70 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <span class="text-xl shrink-0">${m.wordObj.emoji}</span>
                      <div class="min-w-0">
                        <div class="text-xs font-bold text-stone-800 truncate">
                          <span class="px-1.5 py-0.5 rounded-md ${badgeColor}">${m.wordObj.article}</span>
                          ${m.wordObj.de}
                        </div>
                        <div class="text-[11px] text-stone-400 truncate">${m.wordObj.ru} · <span class="text-rose-500 line-through">${m.userAnswer}</span></div>
                      </div>
                    </div>
                    <button
                      type="button"
                      data-mistake-idx="${idx}"
                      aria-label="Озвучить с артиклем"
                      class="mistake-mic-btn soft-btn w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 border border-stone-200/80 text-stone-700 flex items-center justify-center text-sm shrink-0"
                    >
                      🎙️
                    </button>
                  </div>
                `;
              }).join('')}
            `}
          </div>
        </div>
      `;

      document.querySelectorAll(".mistake-mic-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-mistake-idx"), 10);
          const mistake = state.mistakes[idx];
          if (mistake && mistake.wordObj) {
            speakGermanWordWithArticle(mistake.wordObj, btn);
          }
        });
      });

      document.getElementById("retryDeckBtn").addEventListener("click", () => {
        if (isLearnedQuiz) {
          startAllLearnedQuiz();
        } else {
          startDeckSession(state.mode, 0);
        }
      });

      document.getElementById("toCategoriesBtn").addEventListener("click", () => {
        state.screen = "categories";
        render();
      });
    }

    // Запуск приложения
    render();
  </script>
</body>
</html>
